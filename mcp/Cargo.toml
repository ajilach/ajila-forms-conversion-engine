[package]
name = "mcp"
version = "0.1.37"
edition = "2024"

[[bin]]
name = "mcp"
path = "src/main.rs"

[dependencies]
agent = { path = "../agent" }
blueprint = { path = "../core" }
rmcp = { version = "1.7.0", features = ["server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
