[package]
name = "blueprint"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "blueprint"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
thiserror = "1.0"
boa_engine = "0.20"
boa_gc = "0.20"
image = "0.25.9"
imageproc = "0.26.0"
lopdf = "0.34"
quick-xml = "0.36"
rust_decimal = "1.40.0"
clap = { version = "4.5", features = ["derive"] }
ttf-parser = "0.25"
regex-lite = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
zip = "2"
rayon = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pipeline"
harness = false
