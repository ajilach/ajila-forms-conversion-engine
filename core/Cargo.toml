[package]
name = "blueprint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["semantic-matching"]
semantic-matching = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
]

[dependencies]
ab_glyph = "0.2.32"
thiserror = "1.0"
boa_engine = "0.20"
boa_gc = "0.20"
image = { workspace = true }
imageproc = "0.26.0"
lopdf = "0.34"
quick-xml = "0.36"
rust_decimal = "1.40.0"
log = { workspace = true }
ttf-parser = "0.25"
regex-lite = { workspace = true }
uuid = { workspace = true, features = ["v5", "serde", "js"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { version = "1.0", features = ["uuid1"] }
base64 = { workspace = true }
zip = { workspace = true }
tera = "1"
toml = "0.8"
include_dir = "0.7"
hyphenation = { version = "0.8.4", features = ["embed_all"] }
whatlang = "0.16"
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }
boa_engine = { version = "0.20", features = ["js"] }
js-sys = "0.3"
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["unstable_wasm"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pipeline"
path = "benches/pipeline.rs"
harness = false
