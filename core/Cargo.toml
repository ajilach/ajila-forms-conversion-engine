[package]
name = "blueprint"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
ab_glyph = "0.2.32"
thiserror = "1.0"
boa_engine = "0.20"
boa_gc = "0.20"
image = "0.25.9"
imageproc = "0.26.0"
lopdf = "0.34"
quick-xml = "0.36"
rust_decimal = "1.40.0"
log = "0.4"
ttf-parser = "0.25"
regex-lite = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde", "js"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
tera = "1"
toml = "0.8"
include_dir = "0.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }
boa_engine = { version = "0.20", features = ["js"] }
js-sys = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pipeline"
path = "benches/pipeline.rs"
harness = false
