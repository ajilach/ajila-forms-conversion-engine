[package]
name = "blueprint-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "blueprint"
path = "src/main.rs"

[dependencies]
blueprint = { path = "../core", features = ["semantic-matching"] }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde_json = "1.0"
