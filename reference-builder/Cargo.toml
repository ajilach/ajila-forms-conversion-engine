[package]
name = "reference-builder"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "reference-builder"
path = "src/main.rs"

[dependencies]
blueprint = { path = "../core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
