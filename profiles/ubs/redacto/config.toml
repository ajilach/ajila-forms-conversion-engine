# =============================================================================
# UBS Redacto Output Profile
# =============================================================================
#
# Emits a PostgreSQL dump for the Ajila Redacto platform (schema app_redacto).
# Use with:  blueprint --profile ubs --redacto input/<text-only>.pdf
#
# Template syntax: Tera (Jinja2-style)
#   Namespaces:
#     xfa.*        — raw XFA <variables><text> from the PDF
#     variables.*  — user-defined intermediate values (below)

# Business identifier of the document, e.g. "aaad_001".
# Written to documents.document_id and configuration.document.id (varchar(50)).
document_id = "{{ xfa.formrange_code | lower }}_{{ xfa.formrange_entity }}"

# Human-readable title, rendered into the HTML <title>.
title = "{{ xfa.formrange_code }}_{{ xfa.formrange_entity }}"

# Stylesheet resolved from the Redacto bundle (styles/<name>). UBS has no
# brand-specific theme yet — the tenant stylesheet that used to exist here
# (ubs-default.css) was byte-identical to default.css apart from a comment and
# was deleted platform-side as dead weight, so this points at the generic one.
style = "default.css"

# Page header. Ships as a text asset in the document configuration's `header`
# section, which Redacto draws at the top of every page.
#
# Rendered once PER LANGUAGE, against that language's own XFA variables and its
# own recovered `page.header`, so every language variant gets its own wording.
# A language whose value comes out empty falls back to the master language's,
# since Redacto fails a render when an asset has no version for the requested
# language.
#
# The rendered value is plain text: line breaks are kept (each line becomes one
# paragraph in the asset) and markup is escaped rather than parsed, so a
# template emitting tags shows them literally. The whole header is wrapped in
# `<div class="right preserve-spaces">`: `.right` floats it clear of the page
# logo (legacy v1 got this from the Java renderer automatically; v2's
# authored-HTML header must ask for it explicitly, or the text overlaps the
# logo), and `.preserve-spaces` keeps whitespace exactly as written.
#
# The header is the text drawn top-of-page on the master page — the validity
# line and legal entity (e.g. "Gültig ab 02.01.2018 UBS Europe SE"). It is not
# an XFA variable, so the analysis recovers it from the document's header
# region and exposes it as `page.header`, stacked one line per drawn line.
header = "{{ page.header | default(value='') }}"

# Authoring user recorded as the document owner. Redacto rejects authoring
# writes against a document that has no (USER, OWNER, DOCUMENT) ownership row.
owner_id = "admin"

master_language = "en"

# Lifecycle status of the generated variants: DRAFT keeps them editable.
status = "DRAFT"

# styledPanel classes defined in default.css.
grid_panel_style = "layout-split-block"
footnote_panel_style = "footnote"
# Applied to a section the source laid out as a multi-column text flow.
# `layout-split` sets column-count: 2 with column-fill: balance, so the
# renderer reflows the section across two balanced columns.
column_panel_style = "layout-split"

# Page footer fields. Each becomes its own text-asset span,
# `<span class="{class}">value</span>`, in the document configuration's
# `footer` section, drawn at the bottom of every page. Rendered once PER
# LANGUAGE like the header. Fields are separated by one literal space in the
# markup and appear in the order listed below; a field whose value is blank
# for a language is skipped for that language, and — like the header — a
# language whose fields ALL come out blank falls back to the master language's
# fields wholesale. The footer asset also always carries the legacy
# page-number counter after the field spans (not configurable), which is what
# `HtmlDocumentService.renderLegacyFurniture` added automatically for every v1
# document.
#
# The seven fields mirror the UBS master page's `Footer_Line_*` XFA variables,
# in source order:
#   <form id> <language> <version> <MAN code> <form code> <release date> <j-version>
#   e.g. "66300 EN V0 019 AAEV 31.10.2019 N1"
# Each lookup defaults to empty so the profile still resolves on a document
# that lacks the footer variables (e.g. a plain, non-UBS text PDF).
#
# NOTE: this must be the LAST section in the file — TOML does not allow a bare
# `key = value` after an array-of-tables header.
[[footer_fields]]
class = "footer-form-id"
template = "{{ xfa.Footer_Line_txtformid | default(value='') }}"

[[footer_fields]]
class = "footer-language"
template = "{{ xfa.Footer_Line_txtlanguage | default(value='') }}"

[[footer_fields]]
class = "footer-version"
template = "{{ xfa.Footer_Line_txtvversion | default(value='') }}"

[[footer_fields]]
class = "footer-man-code"
template = "{{ xfa.Footer_Line_MANCode | default(value='') }}"

[[footer_fields]]
class = "footer-form-code"
template = "{{ xfa.formrange_code | default(value='') }}"

[[footer_fields]]
class = "footer-release-date"
template = "{{ xfa.Footer_Line_txtversiondate | default(value='') }}"

[[footer_fields]]
class = "footer-j-version"
template = "{{ xfa.Footer_Line_txtjversion | default(value='') }}"
