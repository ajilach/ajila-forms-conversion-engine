# =============================================================================
# UBS HTML Output Profile
# =============================================================================
#
# Profile directory for UBS-specific HTML output.
# Use with: blueprint --profile profiles/ubs --html input/AAAI_019_DE.pdf
#
# All paths are relative to this directory (profiles/ubs/html/).
#
# Assets (stylesheet, logo, fonts) are base64-encoded and embedded
# directly into the generated HTML — no external file references.

# UBS brand stylesheet (appended after built-in defaults)
stylesheet = "styles.css"

# UBS logo displayed in the sticky header
logo = "logo.png"

# Frutiger — UBS corporate typeface
[[fonts]]
family = "Frutiger"
regular = "fonts/frutiger-light.ttf"
bold = "fonts/frutiger-bold.ttf"
italic = "fonts/frutiger-italic.ttf"
