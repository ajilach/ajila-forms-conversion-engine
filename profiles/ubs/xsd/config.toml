# XSD Output Profile Configuration
#
# This file configures how structured form content maps to XSD schema elements.
#
# [elements.<name>]       — field → xs:element mappings
#   synonyms              — list of strings to match (case-insensitive substring)
#   type                  — XSD type (e.g. "xs:string", "xs:decimal", or predefined)
#
# All *.xsd files in the types/ subdirectory are automatically indexed.
# An <xs:include> directive is emitted for every indexed file that declares a
# type actually referenced by the generated schema.
#
# Complex types are auto-matched: xs:complexType definitions from the types/
# directory are parsed (including xs:extension inheritance and xs:element ref
# resolution). During generation, a heading's resolved children are compared
# against the registry — if all children (name + type) form a subset of a
# registered type's elements, the best-matching type is used.
#
# schemaLocationPrefix — prefix prepended to the relative path of each types/
#   file when constructing the schemaLocation attribute (default: "../")

schemaLocationPrefix = "../"

# rootElementName — template for the XSD root element name.
# May contain {{ form_code }} which is replaced with the actual form code.
rootElementName = "UBSAF_{{ form_code }}"

# fragmentBindRefPrefix — prefix used for fragment bindRef paths.
# Fragments use a generic prefix so they can be reused across forms.
# May contain {{ form_code }} for expansion.  When omitted, fragments
# use the same root element name as the form.
fragmentBindRefPrefix = "UBSAF_{{ form_code }}"

masterLanguage = "en"

# ─── Elements ──────────────────────────────────────────────────────────────────

# --- Name fields ---

[elements.LastName]
synonyms = ["Last Name", "Nachname", "Cognome", "Apellido(s)",]
type = "xs:string"

[elements.FirstName]
synonyms = ["First Name(s)", "Vorname(n)", "Nome(i)", "Nombre(s)", "Vorname"]
type = "xs:string"

[elements.Name]
synonyms = ["Name", "Nome", "Nombre", "Nome della società", "Name des Kunden", "Name of client", "Nome del cliente"]
type = "xs:string"

[elements.Company]
synonyms = ["Company", "Firma", "Società"]
type = "xs:string"

# --- Address fields ---

[elements.Street]
synonyms = ["Street", "Straße", "Strasse/Nr.", "Via", "Calle"]
type = "xs:string"

[elements.PostalCode]
synonyms = ["Postal Code", "PLZ", "ZIP", "CAP", "Código postal"]
type = "xs:string"

[elements.Place]
synonyms = ["Ort", "Località", "Place", "Lugar"]
type = "xs:string"

[elements.City]
synonyms = ["City", "Stadt"]
type = "xs:string"

[elements.Country]
synonyms = ["Country", "Land", "Paese", "País"]
type = "xs:string"

[elements.StreetNumber]
synonyms = ["Nr.", "Nr", "No.", "No", "Nº", "Adress-Nr.", "Adress-Nummer"]
type = "xs:string"

# --- Contact fields ---

[elements.Phone]
synonyms = ["Telephone", "Phone", "Mobile", "Telefon", "Telefax privat", "Telefax beruflich"]
type = "xs:string"

[elements.Email]
synonyms = ["E-Mail", "Email"]
type = "xs:string"

# --- Financial fields ---

[elements.Currency]
synonyms = ["Currency", "Währung"]
type = "xs:string"

[elements.IBAN]
synonyms = ["IBAN"]
type = "xs:string"

[elements.AccountNumber]
synonyms = ["Account No", "Konto-Nr", "Konto Nr"]
type = "xs:string"

# --- Date / time fields ---

[elements.Date]
synonyms = ["Date", "Datum", "Data", "Fecha"]
type = "xs:date"

# --- Other common fields ---

[elements.Role]
synonyms = ["Role", "Rolle", "Funktion"]
type = "xs:string"

[elements.MaritalStatus]
synonyms = ["Marital Status", "Zivilstand", "Familienstand", "Estado civil"]
type = "xs:string"

[elements.DateOfBirth]
synonyms = ["Date of Birth", "Geburtsdatum", "Fecha de nacimiento"]
type = "xs:date"

[elements.FormOfAddress]
synonyms = ["Form of Address", "Anrede", "Anredesprache"]
type = "xs:string"

[elements.OURef]
synonyms = ["OU Ref", "OURef", "OU-Ref"]
type = "xs:string"

[elements.Nationality]
synonyms = ["Nationality", "Nationalität", "Nazionalità", "Nacionalidad"]
type = "xs:string"

[elements.Title]
synonyms = ["Title", "Titel", "Titolo", "Título"]
type = "xs:string"

[elements.Gender]
synonyms = ["Gender", "Geschlecht", "Genere", "Género"]
type = "xs:string"

[elements.Domicile]
synonyms = ["Domicile", "Domizil", "Domicilio"]
type = "xs:string"

[elements.FullName]
synonyms = ["Full Name", "Vollständiger Name"]
type = "xs:string"

[elements.CorrespondenceLanguage]
synonyms = ["Correspondence Language", "Korrespondenzsprache"]
type = "xs:string"

# ─── Sections ──────────────────────────────────────────────────────────────────
#
# [sections.<name>]       — section name overrides based on content matching
#   patterns              — list of regex patterns (case-insensitive) matched
#                           against the full section text (heading + body).
#                           Longest match wins when multiple patterns match.

# --- Data sections (role/person types) ---
# These patterns are matched against the heading first (priority), then body
# text (only if the heading is generic like "Step 1"). The code handles this
# priority so no anchoring is needed here.

[sections.AccountHolder]
patterns = [
    "account holder|kontoinhaber|titulaire du compte|titolare del conto|titular de la cuenta",
]

[sections.Lessee]
patterns = [
    "lessee|mieter|locataire|locatario|arrendatario",
]

[sections.ContractingPartner]
patterns = [
    "contracting partner|vertragspartner|cocontractant|partner contrattuale|parte contratante|socio contractual",
]

[sections.BeneficialOwner]
patterns = [
    "beneficial owner|wirtschaftlich berechtig|ayant droit économique|avente diritto economico|beneficiario económico|beneficiario efectivo",
]

[sections.Trustee]
patterns = [
    "trustee|treuhänder|fiduciaire|fiduciario",
]

[sections.AuthorizedSigner]
patterns = [
    "authorized signatory|zeichnungsberechtig|signataire autorisé|firmatario autorizzato|firmante autorizado",
]

[sections.GeneralPOA]
patterns = [
    "general power of attorney|generalvollmacht|unbeschränkte vollmacht|procuration générale|procura generale|poder general|unlimited power of attorney",
]

[sections.LimitedPOA]
patterns = [
    "limited power of attorney|spezialvollmacht|beschränkte vollmacht|procuration limitée|procura limitata|poder limitado",
]

[sections.EBankingUser]
patterns = [
    "e-banking user|e-banking.benutzer|utilisateur e-banking|utente e-banking",
]

[sections.FIM]
patterns = [
    "\\bFIM\\b|financial intermediary|finanzintermediär|intermédiaire financier|intermediario finanziario",
]

[sections.ControllingPerson]
patterns = [
    "controlling person|kontrollierende person|personne de contrôle|persona di controllo|persona controladora",
]

[sections.ConnectedParty]
patterns = [
    "connected party|verbundene partei|partie connectée|parte connessa|parte conectada",
]

[sections.AuthRep]
patterns = [
    "authorized representative|bevollmächtigter|représentant autorisé|rappresentante autorizzato|representante autorizado|angaben zum bevollmächtigten|details of attorney|attorney",
]

[sections.FIMAuthRep]
patterns = [
    "FIM.*authorized representative|FIM.*bevollmächtigter",
]

# --- Signature sections ---

[sections.AccountHolderSignature]
patterns = [
    "signature of account holder|unterschrift des kontoinhaber|signature du titulaire|firma del titolare del conto|firma del titular",
    "signature of client|unterschrift des kunden|signature du client|firma del cliente",
]

[sections.AuthRepSignature]
patterns = [
    "signature of authorized representative|unterschrift des bevollmächtigten|signature du représentant autorisé|firma del rappresentante autorizzato|firma del representante autorizado|firma del apoderado|firma del procuratore",
]

[sections.LegalRepSignature]
patterns = [
    "signature of legal representative|unterschrift des gesetzlichen vertreter|signature du représentant légal|firma del legale rappresentante|firma del representante legal",
]

[sections.AuthAgentSignature]
patterns = [
    "signature of authorized person|unterschrift der berechtigten person",
]

[sections.CoOwnerSignature]
patterns = [
    "signature of co-owner|unterschrift des miteigentümer",
]

[sections.AttorneySignature]
patterns = [
    "signature of the attorney|unterschrift des treuhänder|signature du mandataire",
]

[sections.CASignature]
patterns = [
    "signature of client advisor|unterschrift des kundenberater|signature du conseiller",
]

[sections.DeskHeadSignature]
patterns = [
    "signature of desk head|unterschrift des abteilungsleiter",
]

[sections.SupervisorSignature]
patterns = [
    "signature of supervisor",
]

[sections.FIMSignature]
patterns = [
    "signature of FIM|unterschrift des FIM|signature du FIM|firma del FIM",
]

[sections.SalesMgrSignature]
patterns = [
    "signature of sales manager|unterschrift des verkaufsleiter",
]

[sections.RelevantPersonSignature]
patterns = [
    "signature of relevant person|unterschrift der relevanten person|signature de la personne concernée|firma della persona rilevante|firma de la persona relevante",
]

[sections.ResponsiblePersonSignature]
patterns = [
    "signature of responsible person|unterschrift der verantwortlichen person",
]

[sections.BorrowerSignature]
patterns = [
    "signature of borrower|unterschrift des kreditnehmer|unterschrift des darlehensnehmer",
]

[sections.BeneficialOwnerSignature]
patterns = [
    "signature of beneficial owner|unterschrift des wirtschaftlich berechtig|signature de l'ayant droit|firma dell'avente diritto",
]

[sections.ContractingPartnerSignature]
patterns = [
    "signature of contracting partner|unterschrift des vertragspartner|signature du cocontractant|firma del contraente|firma del parte contratante",
]

[sections.Signature]
patterns = [
    "^.{0,30}(?:signature\\(s\\)|unterschrift\\(en\\)|firma\\(e\\)|firma\\(s\\))",
]

[sections.CardholderSignature]
patterns = [
    "signature of.*cardholder|unterschrift des karteninhaber|signature du titulaire de la carte|firma del titolare della carta",
]

[sections.BahrainBROSignature]
patterns = [
    "signature.*bahrain.*BRO|BRO.*signature.*bahrain",
]

[sections.BahrainCEOSignature]
patterns = [
    "signature.*bahrain.*CEO|CEO.*signature.*bahrain",
]

[sections.CompanySignature]
patterns = [
    "signature of company|unterschrift der firma|signature de la société|firma della società",
]

[sections.PledgorSignature]
patterns = [
    "signature of.*pledgor|unterschrift des pfandgeber|unterschrift des verpfänder|signature du.*gagiste|firma del.*garante",
]

[sections.CAHSignature1]
patterns = [
    "signature.*client.*poa holder|signature.*client.*PoA|unterschrift.*kunde.*vollmacht",
]
