# =============================================================================
# UBS AEM Forms Output Profile
# =============================================================================
#
# This profile reproduces the legacy UBS-specific AEM output settings.
# Use with:  blueprint --aem profiles/ubs.toml input/AAAI_019_DE.pdf
#
# Template syntax: Tera (Jinja2-style)
#   Namespaces:
#     xfa.*        — raw XFA <variables><text> from the PDF
#     variables.*  — user-defined intermediate values (below)
#   Runtime vars (available in [xml_snippets]):
#     master_language  — auto-detected primary language
#     languages        — comma-separated list of detected languages
#     form_code        — resolved form code
#     author           — authoring user name

title = "{{ xfa.formrange_code }}"

form_path = "{{ variables.entity_dir }}/{{ variables.prefix_dir }}"

form_dir = "AF_{{ xfa.formrange_code }}"

# =============================================================================
# Variables — reusable intermediate values
# =============================================================================
[variables]
entity_dir = """{% if xfa.formrange_entity == "019" %}afforms_germany_all{% elif xfa.formrange_entity == "033" %}afforms_italy_all{% elif xfa.formrange_entity == "001" %}afforms_ch_all{% else %}afforms_global_all{% endif %}"""
prefix_dir = "af_{{ xfa.formrange_code | truncate(length=2, end='') | lower }}"

# =============================================================================
# Paths
# =============================================================================
[paths]
template_path = "/conf/ajila-forms-ubs/settings/wcm/templates/basic"
page_resource_type = "/apps/ajila-forms-customers/ajila-forms-ubs/components/pages/aftemplatedpage"
theme_ref = "/content/dam/formsanddocuments-themes/ajila-forms-ubs/standard-theme"
redirect_url = "/content/forms/af/afforms_global_common/confirm-successful-submission"
meta_template_ref = "/content/dam/formsanddocuments/reference-dor-templates/ajila-forms-ubs/02_forms/UBS_Blank_DoR.xdp"
dor_template_ref = "/content/dam/formsanddocuments/{{ variables.entity_dir }}/{{ variables.prefix_dir }}/AF_{{ xfa.formrange_code }}/jcr:content/renditions/dorTemplate"

# =============================================================================
# Components
# =============================================================================
[components]
resource_type_base = "fd/af/components"
custom_resource_type_base = "ajila-forms-customers/ajila-forms-ubs/components"
action_type = "ajila-forms-customers/ajila-forms-ubs/components/actions/submit"
client_lib_ref = "ajila-forms-ubs"
wizard_layout = "ajila-forms-customers/ajila-forms-ubs/layouts/panel/wizard"
form_type = " "

[components.textbox]
css = "widget_ajila-forms-ubs-textbox"

[components.numericbox]
css = "widget_ajila-forms-ubs-numericbox"

[components.datepicker]
css = "widget_ajila_forms_datepicker"

[components.checkbox]
css = "widget_ajila_forms_checkbox"

[components.radiobutton]
css = "widget_ajila_forms_radiobutton"

[components.dropdownlist]
css = "widget_ajila_forms_dropdownlist"

[components.primarybutton]
css = "widget_ajila-forms-ubs-primarybutton"

[components.textbox_multiline]
css = "widget_ajila-forms-ubs-textbox ubs-textbox-multiline"

# =============================================================================
# Language Synonyms
# =============================================================================
[language_synonyms]
de = ["de-ch"]
sp = ["es"]

# =============================================================================
# Toolbar Scripts
# =============================================================================
[scripts]
next_click = "window.com.ajila.forms.ubs.navigation.nextStep(this);"
include_preview_button = true

# =============================================================================
# XML Snippets — injected at specific points in the output
# =============================================================================
[xml_snippets]

# --- DOR Print Branding (injected inside <print>) ---
print_branding = '''
    <branding jcr:primaryType="nt:unstructured">
        <items jcr:primaryType="nt:unstructured">
            <masterpage0 jcr:primaryType="nt:unstructured">
                <items jcr:primaryType="nt:unstructured">
                    <txtBankingRelationship jcr:primaryType="nt:unstructured"/>
                    <ShowBankingRelationship
                        jcr:primaryType="nt:unstructured"
                        value="1"/>
                    <Header jcr:primaryType="nt:unstructured">
                        <items jcr:primaryType="nt:unstructured">
                            <AF_LOGO_IMAGE
                                jcr:lastModified="{Date}2025-01-01T00:00:00.000+01:00"
                                jcr:lastModifiedBy="{{ author }}"
                                jcr:primaryType="nt:unstructured"
                                valueFrom="template"/>
                            <FormType
                                jcr:primaryType="nt:unstructured"
                                resourceType="granite/ui/components/coral/foundation/form/textarea"
                                value=" "
                                valueFrom="     "/>
                            <HeaderInfo jcr:primaryType="nt:unstructured">
                                <items jcr:primaryType="nt:unstructured">
                                    <AF_HEADER_TEXT
                                        jcr:primaryType="nt:unstructured"
                                        resourceType="granite/ui/components/coral/foundation/form/textarea"
                                        valueFrom="template"/>
                                    <AF_FORM_TITLE
                                        jcr:primaryType="nt:unstructured"
                                        resourceType="granite/ui/components/coral/foundation/form/textarea"
                                        valueFrom="formTitle"/>
                                </items>
                            </HeaderInfo>
                            <Adressblock jcr:primaryType="nt:unstructured">
                                <items jcr:primaryType="nt:unstructured">
                                    <senderAddressTitle
                                        jcr:primaryType="nt:unstructured"
                                        resourceType="granite/ui/components/coral/foundation/form/textarea"
                                        valueFrom="template"/>
                                </items>
                            </Adressblock>
                        </items>
                    </Header>
                    <formId jcr:primaryType="nt:unstructured"/>
                    <displayLanguage jcr:primaryType="nt:unstructured"/>
                    <language jcr:primaryType="nt:unstructured"/>
                    <footerVersion jcr:primaryType="nt:unstructured"/>
                    <mandator jcr:primaryType="nt:unstructured"/>
                    <footerFormCode jcr:primaryType="nt:unstructured"/>
                    <footerFormVersionDate jcr:primaryType="nt:unstructured"/>
                    <APPCode
                        jcr:primaryType="nt:unstructured"
                        value="AFC"/>
                    <footerFreeText jcr:primaryType="nt:unstructured"/>
                </items>
            </masterpage0>
        </items>
    </branding>
'''

# --- Last Panel (preview panel with metadata, message boxes, carousel) ---
last_panel = '''
    <previewpanel_copy
        jcr:created="{Date}2025-01-01T00:00:00.000Z"
        jcr:createdBy="{{ author }}"
        jcr:lastModified="{Date}2025-01-01T00:00:00.000Z"
        jcr:lastModifiedBy="{{ author }}"
        jcr:primaryType="nt:unstructured"
        jcr:title="Preview"
        sling:resourceType="fd/af/components/panel"
        dorExclusion="true"
        guideNodeClass="guidePanel"
        name="preview"
        textIsRich="true"
        validateOnStepCompletion="{Boolean}false">
        <items jcr:primaryType="nt:unstructured">
            <messagebox_ElsigCheck
                jcr:primaryType="nt:unstructured"
                sling:resourceType="ajila-forms-customers/ajila-forms-ubs/components/controls/messagebox"
                css="messagebox-ElsigCheck ubs-margin-10"
                guideNodeClass="guideTextDraw"
                hideTitle="{Boolean}true"
                i18nBodyId="ajila-forms-ubs-signature-level-error"
                name="messagebox_ElsigCheck"
                visible="{Boolean}true"/>
            <messagebox_SubmissionInfo
                jcr:primaryType="nt:unstructured"
                sling:resourceType="ajila-forms-customers/ajila-forms-ubs/components/controls/messagebox"
                guideNodeClass="guideTextDraw"
                hideTitle="{Boolean}true"
                messageboxBody="&lt;p&gt;By clicking on &quot;Preview&quot;, you can review your document before submission.&lt;/p&gt;&lt;p&gt;After clicking &quot;Submit&quot;, you will no longer be able to edit the document and the PDF will be created for signing.&lt;/p&gt;"
                name="previewInformation"
                visible="{Boolean}true"/>
            <carousel
                jcr:created="{Date}2025-01-01T00:00:00.000Z"
                jcr:createdBy="{{ author }}"
                jcr:lastModified="{Date}2025-01-01T00:00:00.000Z"
                jcr:lastModifiedBy="{{ author }}"
                jcr:primaryType="nt:unstructured"
                jcr:title="Preview Carousel"
                sling:resourceType="ajila-forms-customers/ajila-forms-ubs/components/controls/carousel"
                arrows="true"
                autofillFieldKeyword="name"
                css="widget_ajila_forms_carousel"
                displayPatternType="custom"
                displayPictureClause="\[0-9]"
                dorExclusion="true"
                guideNodeClass="guideTextBox"
                initScript="com.ajila.forms.control.carousel.initialize(this)"
                lazyLoadingStrategy="ondemand"
                name="carouselPreview"
                placeholderText="Message"
                showDots="true"
                slidesToScroll="1"
                slidesToShow="1"
                textIsRich="[true,true,true]"
                visible="{Boolean}false"/>
            <messagebox_CarouselPreview
                jcr:primaryType="nt:unstructured"
                sling:resourceType="ajila-forms-customers/ajila-forms-ubs/components/controls/messagebox-CarouselPreviewError"
                buttonAction="window.com.ajila.forms.control.messagebox_carouselpreview_error.initCarouselPreview()"
                css="ubs-margin-10"
                guideNodeClass="guideTextDraw"
                i18nBodyId="ajila-forms-ubs-errorbox-carousel-message"
                i18nButtonLabelId="ajila-forms-ubs-errorbox-carousel-button-label"
                i18nTitleId="ajila-forms-ubs-errorbox-carousel-title"
                messageboxType="{Long}4"
                name="previewErrorMessage"
                showButton="{Boolean}true"
                visible="{Boolean}false"/>
            <messagebox_SubmissionError
                jcr:primaryType="nt:unstructured"
                sling:resourceType="ajila-forms-customers/ajila-forms-ubs/components/controls/messagebox"
                guideNodeClass="guideTextDraw"
                messageboxBody="&lt;p&gt;The form could not be sent. Please try again later.&lt;/p&gt;"
                messageboxTitle="Submission failed"
                messageboxType="{Long}4"
                name="submitErrorMessage"
                visible="{Boolean}false"/>
            <doroptionsubs
                jcr:created="{Date}2025-01-01T00:00:00.000Z"
                jcr:createdBy="{{ author }}"
                jcr:lastModified="{Date}2025-01-01T00:00:00.000Z"
                jcr:lastModifiedBy="{{ author }}"
                jcr:primaryType="nt:unstructured"
                sling:resourceType="ajila-forms-customers/ajila-forms-ubs/components/controls/dorOptionsUBS"
                _value="Further configurations for the document of record"
                dorExclusion="true"
                guideNodeClass="guideTextDraw"
                name="doroptionsubs"
                visible="false"/>
            <metadata
                jcr:created="{Date}2025-01-01T00:00:00.000Z"
                jcr:createdBy="{{ author }}"
                jcr:lastModified="{Date}2025-01-01T00:00:00.000Z"
                jcr:lastModifiedBy="{{ author }}"
                jcr:primaryType="nt:unstructured"
                sling:resourceType="ajila-forms-customers/ajila-forms-ubs/components/controls/metadata"
                _value="Metadata"
                dorExclusion="true"
                formrange_afmasterlanguage="{{ master_language | upper }}"
                formrange_aftype="Single"
                formrange_code="{{ form_code }}"
                guideNodeClass="guideTextDraw"
                name="metadata"
                visible="false">
                <entities jcr:primaryType="nt:unstructured">
                    <item0
                        jcr:primaryType="nt:unstructured"
                        formrange_clpmandatory="{{ xfa.formrange_clpmandatory | default(value='false') }}"
                        formrange_entity="{{ xfa.formrange_entity }}"
                        formrange_language="{{ languages | upper }}">
                        <cdoks jcr:primaryType="nt:unstructured">
                            <item0
                                jcr:primaryType="nt:unstructured"
                                formrange_cdokinfo="{% if xfa.formrange_cdokinfo is defined and xfa.formrange_cdokinfo != '' %}{{ xfa.formrange_cdokinfo }}{% elif xfa.Footer_Line_txtformid is defined %}{{ xfa.Footer_Line_txtformid }}{% endif %}"
                                formrange_partnerlevel="{{ xfa.formrange_partnerlevel | default(value='false') }}"
                                formrange_releasedate="{% if xfa.formrange_releasedate is defined and xfa.formrange_releasedate != '' %}{{ xfa.formrange_releasedate }}{% elif xfa.Footer_Line_txtversiondate is defined %}{{ xfa.Footer_Line_txtversiondate }}{% endif %}"
                                formrange_version="{{ xfa.formrange_version | default(value='') }}"/>
                        </cdoks>
                    </item0>
                </entities>
            </metadata>
        </items>
        <layout
            jcr:primaryType="nt:unstructured"
            sling:resourceType="fd/af/layouts/gridFluidLayout2"
            columns="1"
            dorLayoutType="columnar"
            dorNumCols="1"
            nonNavigable="{Boolean}true"
            toolbarPosition="Bottom"/>
    </previewpanel_copy>
'''
