name: Jira → Copilot Dispatch

# Periodically scans Jira for tickets labelled `copilot`, creates a matching GitHub
# issue for each and assigns the GitHub Copilot coding agent (which then opens its own
# draft PR). The ticket is commented on and the label removed so it is processed once.
on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: # manual trigger for testing

permissions:
  issues: write
  contents: read

jobs:
  dispatch:
    name: Dispatch labelled Jira tickets to Copilot
    runs-on: ubuntu-latest
    # Serialize runs so a long-running hour cannot overlap the next cron tick and
    # process the same ticket twice.
    concurrency:
      group: jira-copilot
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dispatch tickets
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          GITHUB_PAT: ${{ secrets.COPILOT_PAT }}
          GITHUB_REPO: ${{ github.repository }}
          BASE_BRANCH: develop
          COPILOT_LABEL: copilot
        run: python scripts/jira_copilot_dispatch.py
