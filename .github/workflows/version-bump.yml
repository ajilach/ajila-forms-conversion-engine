name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: read

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check if tests passed
        run: |
          # Get the latest workflow run status for rust.yml on current commit
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "Checking test status for commit: $COMMIT_SHA"
          
          # Use GitHub CLI to check if rust.yml passed (using workflow name "Test")
          TEST_STATUS=$(gh run list --workflow="Test" --commit=$COMMIT_SHA --json conclusion --limit 1 | jq -r '.[0].conclusion // "none"')
          echo "$TEST_STATUS"
          
          if [ "$TEST_STATUS" != "success" ]; then
            echo "ERROR: Tests have not passed for this commit. Run tests first."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup SSH for private git dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLUEPRINT_DEPLOY_KEY }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        run: cargo install cargo-edit

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          cargo set-version --bump ${{ inputs.bump_type }}
          NEW_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Commit version bump
        run: |
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git push

      - name: Create and push tag
        run: |
          git tag v${{ steps.bump.outputs.new_version }}
          git push origin v${{ steps.bump.outputs.new_version }}

      - name: Trigger release workflow
        run: |
          echo "Release workflow will be triggered automatically by the new tag"
