name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup SSH for private git dependencies
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.BLUEPRINT_DEPLOY_KEY }}
    
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
    
    - name: Build (desktop)
      run: cargo build --features desktop --verbose
    - name: Build (server)
      run: cargo build --features server --verbose
    - name: Run tests
      run: cargo test --features server --verbose
