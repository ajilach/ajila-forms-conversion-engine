name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
    # blueprint-app is the desktop (dioxus + mistralrs/metal) crate; it pulls in
    # Linux GTK system libs and the Apple-only Metal backend, neither of which is
    # available on the bare test runner. It's exercised by release.yml instead.
    - name: Build
      run: cargo build --verbose --release --workspace --exclude blueprint-app
    - name: Run tests
      run: cargo test --verbose --release --workspace --exclude blueprint-app

    - name: Tag commit as tested
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -f "tested-${{ github.sha }}"
        git push origin "tested-${{ github.sha }}" --force
