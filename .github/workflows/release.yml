name: Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    name: Check for version change
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare Cargo.toml version to latest release
        id: check
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Cargo.toml version: $VERSION"

          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1 || true)
          echo "Latest release tag: $LATEST_TAG"

          if [ "v$VERSION" != "$LATEST_TAG" ]; then
            echo "Version changed — will release v$VERSION"
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged — skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH for private git dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLUEPRINT_DEPLOY_KEY }}

      - name: Install Linux dependencies (cached)
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          version: 1.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build (desktop)
        run: cargo build --features desktop --verbose
      - name: Build (server)
        run: cargo build --features server --verbose
      - name: Run tests
        run: cargo test --features server --verbose

  create-release:
    name: Create Release
    needs: [check-version, test]
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ needs.check-version.outputs.version }}
          git push origin v${{ needs.check-version.outputs.version }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          release_name: Release v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false

  build-and-upload:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: blueprint-app
            asset_name: blueprint-macos-aarch64
            platform: desktop
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: blueprint-app
            asset_name: blueprint-linux-x86_64
            platform: desktop
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: blueprint-app.exe
            asset_name: blueprint-windows-x86_64.exe
            platform: desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH for private git dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLUEPRINT_DEPLOY_KEY }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dioxus CLI
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            curl -L https://github.com/DioxusLabs/dioxus/releases/latest/download/dx-x86_64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv dx /usr/local/bin/
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            curl -L https://github.com/DioxusLabs/dioxus/releases/latest/download/dx-aarch64-apple-darwin.tar.gz | tar xz
            sudo mv dx /usr/local/bin/
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            curl -L https://github.com/DioxusLabs/dioxus/releases/latest/download/dx-x86_64-pc-windows-msvc.zip -o dx.zip
            unzip dx.zip
            mv dx.exe C:/Windows/System32/
          fi
        shell: bash

      - name: Install Linux dependencies (cached)
        if: matrix.os == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          version: 1.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build with Dioxus CLI
        run: |
          if [ "${{ matrix.platform }}" == "desktop" ]; then
            dx build --release --platform desktop
          else
            dx build --release --platform ${{ matrix.platform }} --fullstack
          fi
        shell: bash

      - name: Sign macOS app (ad-hoc)
        if: startsWith(matrix.os, 'macos')
        run: |
          # Ad-hoc sign the app bundle to prevent "damaged" message
          codesign --force --deep --sign - target/dx/blueprint-app/release/macos/BlueprintApp.app
        shell: bash

      - name: Prepare artifact
        if: matrix.platform == 'desktop'
        run: |
          mkdir -p release-artifacts
          if [[ "${{ matrix.os }}" == macos* ]]; then
            # macOS builds create a .app bundle
            cp -r target/dx/blueprint-app/release/macos/BlueprintApp.app release-artifacts/
            cd release-artifacts
            # Create a zip of the .app bundle (use ditto to preserve signatures)
            ditto -c -k --keepParent BlueprintApp.app ${{ matrix.asset_name }}.zip
            # Also create a tar.gz
            tar -czf ${{ matrix.asset_name }}.tar.gz BlueprintApp.app
            cd ..
          elif [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            # Linux builds create an app directory
            cp -r target/dx/blueprint-app/release/linux/app release-artifacts/
            cd release-artifacts
            tar -czf ${{ matrix.asset_name }}.tar.gz app
            cd ..
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            # Windows builds create an app directory
            cp -r target/dx/blueprint-app/release/windows/app release-artifacts/
            cd release-artifacts
            7z a ${{ matrix.asset_name }}.zip app
            cd ..
          fi
        shell: bash

      - name: Upload Release Asset (Unix Desktop)
        if: matrix.platform == 'desktop' && matrix.os != 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release-artifacts/${{ matrix.asset_name }}.tar.gz
          asset_name: ${{ matrix.asset_name }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload Release Asset (Windows Desktop)
        if: matrix.platform == 'desktop' && matrix.os == 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release-artifacts/${{ matrix.asset_name }}.zip
          asset_name: ${{ matrix.asset_name }}.zip
          asset_content_type: application/zip

  build-docker:
    name: Build Docker Image (push to ACR)
    needs: create-release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH for private git dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLUEPRINT_DEPLOY_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- ACR credentials from 1Password ---
      - name: Load ACR secrets (1Password)
        id: op-load-acr-secrets
        uses: 1password/load-secrets-action@v2.0.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          REGISTRY: op://ajila_CICD/ACR-DEV/login_server
          REGISTRY_USER: op://ajila_CICD/ACR-DEV/username
          REGISTRY_PASSWORD: op://ajila_CICD/ACR-DEV/password

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build and push Docker image (ACR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/forms-conversion-engine:latest
            ${{ env.REGISTRY }}/forms-conversion-engine:v${{ needs.create-release.outputs.version }}
          ssh: default
          labels: |
            org.opencontainers.image.source=https://github.com/ajilach/blueprint-app
            org.opencontainers.image.description=Ajila Forms Conversion Engine
            org.opencontainers.image.version=v${{ needs.create-release.outputs.version }}