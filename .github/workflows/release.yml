name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH for private git dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLUEPRINT_DEPLOY_KEY }}

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version from Cargo.toml: $VERSION"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false

  build-and-upload:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: blueprint-app
            asset_name: blueprint-macos-aarch64
            platform: desktop
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: blueprint-app
            asset_name: blueprint-linux-x86_64
            platform: desktop
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: blueprint-app.exe
            asset_name: blueprint-windows-x86_64.exe
            platform: desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH for private git dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLUEPRINT_DEPLOY_KEY }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dioxus CLI
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            curl -L https://github.com/DioxusLabs/dioxus/releases/latest/download/dx-x86_64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv dx /usr/local/bin/
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            curl -L https://github.com/DioxusLabs/dioxus/releases/latest/download/dx-aarch64-apple-darwin.tar.gz | tar xz
            sudo mv dx /usr/local/bin/
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            curl -L https://github.com/DioxusLabs/dioxus/releases/latest/download/dx-x86_64-pc-windows-msvc.zip -o dx.zip
            unzip dx.zip
            mv dx.exe C:/Windows/System32/
          fi
        shell: bash

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build with Dioxus CLI
        run: |
          if [ "${{ matrix.platform }}" == "desktop" ]; then
            dx build --release --platform desktop
          else
            dx build --release --platform ${{ matrix.platform }} --fullstack
          fi
        shell: bash

      - name: Sign macOS app (ad-hoc)
        if: startsWith(matrix.os, 'macos')
        run: |
          # Ad-hoc sign the app bundle to prevent "damaged" message
          codesign --force --deep --sign - target/dx/blueprint-app/release/macos/BlueprintApp.app
        shell: bash

      - name: Prepare artifact
        if: matrix.platform == 'desktop'
        run: |
          mkdir -p release-artifacts
          if [[ "${{ matrix.os }}" == macos* ]]; then
            # macOS builds create a .app bundle
            cp -r target/dx/blueprint-app/release/macos/BlueprintApp.app release-artifacts/
            cd release-artifacts
            # Create a zip of the .app bundle (use ditto to preserve signatures)
            ditto -c -k --keepParent BlueprintApp.app ${{ matrix.asset_name }}.zip
            # Also create a tar.gz
            tar -czf ${{ matrix.asset_name }}.tar.gz BlueprintApp.app
            cd ..
          elif [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            # Linux builds create an app directory
            cp -r target/dx/blueprint-app/release/linux/app release-artifacts/
            cd release-artifacts
            tar -czf ${{ matrix.asset_name }}.tar.gz app
            cd ..
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            # Windows builds create an app directory
            cp -r target/dx/blueprint-app/release/windows/app release-artifacts/
            cd release-artifacts
            7z a ${{ matrix.asset_name }}.zip app
            cd ..
          fi
        shell: bash

      - name: Upload Release Asset (Unix Desktop)
        if: matrix.platform == 'desktop' && matrix.os != 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release-artifacts/${{ matrix.asset_name }}.tar.gz
          asset_name: ${{ matrix.asset_name }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload Release Asset (Windows Desktop)
        if: matrix.platform == 'desktop' && matrix.os == 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release-artifacts/${{ matrix.asset_name }}.zip
          asset_name: ${{ matrix.asset_name }}.zip
          asset_content_type: application/zip

  build-docker:
    name: Build Docker Image
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH for private git dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLUEPRINT_DEPLOY_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ajilach/blueprint-app:latest
            ghcr.io/ajilach/blueprint-app:v${{ needs.create-release.outputs.version }}
          ssh: default
          labels: |
            org.opencontainers.image.source=https://github.com/ajilach/blueprint-app
            org.opencontainers.image.description=Blueprint App

