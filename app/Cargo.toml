[package]
name = "blueprint-app"
version = "0.1.29"
edition = "2024"

[features]
default = []
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[dependencies]
dioxus = { version = "0.7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
base64 = "0.22"
blueprint = { path = "../core" }
image = { version = "0.25", features = ["png"] }
pulldown-cmark = "0.10"
uuid = { version = "1", features = ["v4"] }

# Server/Desktop-only deps (not available in WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
dirs = "5.0"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# WASM-only deps (browser downloads)
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Document", "Window"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
