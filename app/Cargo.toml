[package]
name = "blueprint-app"
version = "0.2.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.9", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
base64 = "0.22"
image = { version = "0.25", features = ["png", "jpeg"] }
pulldown-cmark = "0.10"
uuid = { version = "1", features = ["v4"] }
blueprint = { path = "../core" }
agent = { path = "../agent" }
tokio = { version = "1", features = ["full"] }
dirs = "5.0"
toml = "0.8"
reqwest = { version = "0.13", features = ["json", "stream", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["clock"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
regex-lite = "0.1"

# Local inference backend. The Metal GPU backend is Apple-only; on other
# platforms fall back to the default (CPU) backend. The runtime picks the
# device via mistralrs::best_device(), so no source changes are needed.
[target.'cfg(target_vendor = "apple")'.dependencies]
mistralrs = { version = "0.8", default-features = false, features = ["metal"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
mistralrs = { version = "0.8", default-features = false }
