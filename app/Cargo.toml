[package]
name = "blueprint-app"
version = "0.2.8"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.9", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
base64 = "0.22"
image = { version = "0.25", features = ["png", "jpeg"] }
blueprint = { path = "../core" }
agent = { path = "../agent" }
tokio = { version = "1", features = ["full"] }
dirs = "5.0"
toml = "0.8"
reqwest = { version = "0.13", features = ["json", "stream", "multipart"] }
