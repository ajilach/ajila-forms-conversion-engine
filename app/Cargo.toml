[package]
name = "blueprint-app"
version = "0.1.32"
edition = "2024"

[features]
default = []
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[dependencies]
dioxus = { version = "0.7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
base64 = "0.22"
image = { version = "0.25", features = ["png"] }
pulldown-cmark = "0.10"
uuid = { version = "1", features = ["v4"] }

# Server/Desktop-only deps (not available in WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blueprint = { path = "../core" }
tokio = { version = "1", features = ["full"] }
dirs = "5.0"
toml = "0.8"
async-openai = { version = "0.40", features = ["chat-completion", "byot", "model"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["clock"] }

# macOS-only deps (runtime dock icon)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

# WASM-only deps (browser downloads)
[target.'cfg(target_arch = "wasm32")'.dependencies]
blueprint = { path = "../core", default-features = false }
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Document", "Window"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
