[package]
name = "blueprint-app"
version = "0.1.12"
edition = "2024"

[features]
default = []
desktop = ["dioxus/desktop"]
server = ["dioxus/fullstack", "dioxus/server"]
web = ["dioxus/fullstack", "dioxus/web"]

[dependencies]
dioxus = { version = "0.6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
base64 = "0.22"

# Server/Desktop-only deps (not available in WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
blueprint = { path = "../core" }
dirs = "5.0"
image = { version = "0.25", features = ["png"] }
include_dir = "0.7"
toml = "0.8"

# WASM-only deps (browser downloads)
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Document", "Window"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
