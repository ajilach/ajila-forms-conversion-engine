[package]
name = "blueprint-app"
version = "0.2.8"
edition = "2024"

# `unused_qualifications` is deliberately absent: every one of its hits in this
# crate comes from `rsx!` expansion, not from the source.
[lints.clippy]
# All four `#[allow]`s are gone; keep them from creeping back.
too_many_arguments = "deny"
ref_option = "warn"
needless_pass_by_value = "warn"
# Nursery lint, so warn rather than deny — it can false-positive.
redundant_clone = "warn"

[dependencies]
dioxus = { version = "0.7.9", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
base64 = "0.22"
image = { version = "0.25", features = ["png", "jpeg"] }
blueprint = { path = "../core" }
agent = { path = "../agent" }
tokio = { version = "1", features = ["rt", "time", "macros"] }
dirs = "5.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
